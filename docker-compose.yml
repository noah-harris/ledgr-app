volumes:
  op-data:
  restore:
    driver: local
    driver_opts:
      type: none
      device: "D:/Repositories/!BACKUPS/ledgr-app"
      o: bind


  sql-scripts:
    driver: local
    driver_opts:
      type: none
      device: "D:/Repositories/ledgr-app/database"
      o: bind


  appdata:
    driver: local
    driver_opts:
      type: none
      device: "D:/Repositories/!APPDATA/ledgr-app"
      o: bind